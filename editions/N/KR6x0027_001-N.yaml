body:
  text: 人施設論歸命彼世尊應供正覺者論母一一人有六施設是蘊施設處施設界施設諦施設根施設人施設幾許之蘊是蘊施設耶是五蘊色蘊受蘊想蘊行蘊識蘊如此之蘊是蘊施設幾許之處是處施設耶是十二處眼處色處耳處聲處鼻處香處舌處味處身處觸處意處法處如此之處是處施設幾許之界是界施設耶是十八界眼界色界眼識界耳界聲界耳識界鼻界香界鼻識界舌界味界舌識界身界觸界身觸界意界法界意識界如此之界是界施設幾許之諦是諦施設耶是四諦苦諦集諦滅諦道諦如此之諦是諦施設幾許之根是根施設耶是二十二根眼根耳根鼻根舌根身根意根命根女根男根樂根苦根喜根憂根捨根信根進根念根定根慧根未知當知根已知根具知根如此之根是根施設幾許之人是人施設耶一時解脫二不時解脫三動法四不動法五退法六不退法七思不能八護不能九凡夫一種性一一怖畏抑制一二不怖畏抑制一三不能行一四能行一五決定一六不決定一七四向一八四果住一九首等二住劫二一聖二二非聖二三有學二四無學二五非學非無學二六三明二七六通二八正自覺二九獨覺三俱分解脫三一慧解脫三二身證三三見至三四信解三五隨法行三六隨信行三七極七返三八家家三九一種四一來四一不還四二中般涅槃四三生般涅槃四四無行般涅槃四五有行般涅槃四六上流趣阿迦膩吒天四七預流預流果能作證向人四八一來一來果能作證向人四九不還不還果能作證向人五阿羅漢阿羅漢果能作證向人二二人一忿與恨二覆與惱三嫉與慳四誑與諂五無慚與無愧六惡言與惡友七不護根門與食不知量八失念與不正知九破戒與破見一內結與外結一一不忿與不恨一二不覆與不惱害一三不嫉與不慳一四不誑與不諂一五慚與愧一六善言與善友一七護根門與食知量一八正念樹立與正知一九戒具足與見具足二於世間難得二人二一難滿足二人二二易滿足二人二三漏增二人二四不漏增二人二五劣意向與勝意向二六自足與他足三三人一無希望正希望離希望二三病喻人三身證見至信解四糞語華語蜜語者五漏瘡喻心人電光喻心人金剛喻心人六盲一眼兩眼七覆慧人膝慧人廣慧人八此處有欲與有之未離欲一類人此處於欲而離欲於有而未離欲一類人此處於欲與有之離欲一類人九石刻喻人地刻喻人水刻喻人一三樹皮衣喻人一一三迦尸迦衣喻人一二易計量難計量無計量一三此處有不可親近不可倚親不可伺候一類人此處有可親近可倚親可伺候一類人此處有恭敬尊重而可親近可倚親可伺候一類人一四此處有可厭棄不可親近不可倚親不可伺候一類人此處有可捨棄不可親近不可倚親不可伺候一類人此處有可親近可倚親可伺候一類人一五此處於戒完全行而於定與慧一分行一類之人此處於戒與定完全行而於慧一分行一類之人此處於戒與定與慧完全行一類之人一六三師一七其他之三師四四人一不善士由不善士更為不善士者善士由善士更為善士者二惡人由惡人更為惡人者善人由善人更為善人者三惡法由惡法更為惡法者善法由善法更為善法者四有罪多罪少罪無罪五略開知廣演知所引導文句為最六以相應辯非為自在辯者以自在辯非為相應辯者以相應辯為自在辯者非相應辯為非自在辯者七四說法人八四雲喻人九四鼠喻人一四菴摩羅果喻人一一四瓶喻人一二四池喻人一三四軛牛喻人一四四蛇喻人一五此處有不查不究不應稱讚者一類之人此處有不查不究應稱讚者而不稱讚一類之人此處有不查不究於不應信之處而生信一類之人此處有不查不究於可信之處而生不信一類之人一六此處有查究不稱讚不可稱讚者一類之人此處有查究稱讚可稱讚者一類之人此處有查究於不可信之處而生不信一類之人此處有查究於可信之處而生信一類之人一七此處其時有不應稱讚者真實正當不稱讚其時有應稱讚者真實正當不稱讚一類之人此處其時有應稱讚者真實正當稱讚其時又有不應稱讚者真實正當不稱讚不一類之人此處其時有不應稱讚者真實正當不稱讚其時有可稱讚者真實正當稱讚一類之人此處其時有不可稱讚者真實正當不稱讚其時亦有可稱讚者真實正當不稱讚一類之人一八依起策之果而生活依功德之果而不生活者依功德之果而生活依起策之果而不生活者依起策之果而生活又依功德之果而生活者亦不依起策之果而生活又亦不依功德之果而生活者一九以闍而趣向闍者以闇而趣向明者以明而趣向闇者以明而趣向明者二以今下而為當來下以今下而為當來上以今上而為當來下以今上而為當來上者二一四樹喻人二二以色為量而信色者以聲為量而信聲者以麤為量而信麤者以法為量而信法者二三此處有行自利而不行利他一類之人此處有行利他而不行自利一類之人此處有行自利及行利他一類之人此處有不行自利及不行利他一類之人二四此處於自苦而勤自苦一類之人此處令他苦而勤令他苦一類之人此處於自苦自勤苦者令他苦而勤令他苦一類之人此處勤於自苦自苦者勤於他苦他苦者一類之人此處不自苦不勤於自苦不他苦不勤於他苦一類之人二五有貪有瞋有癡有慢二六此處有得內心之止依增上慧不得法之觀一類之人此處依增上慧得法觀不得內心之止一類之人此處有得內心之止又依增上慧得法觀一類之人此處亦不得內心之止依增上慧亦不得法觀一類之人二七順流行人逆流行人自住人已渡彼岸而住於到彼岸果之婆羅門人二八以少聞而聞不達成以少聞而聞達成以多聞而聞不達成以多聞而聞達成者二九不動沙門紅蓮華沙門白蓮華沙門沙門中之柔軟沙門五五人一此處有一類之人作違犯之行又悔又如實不知彼之心解脫慧解脫此中彼其等已生之惡不善法無餘而滅此處有一類之人作違犯之行不悔又如實不知彼之心解脫慧解脫此中彼其等已生之惡不善法無餘滅此處有一類之人不作違犯之行亦悔又如實不知彼之心解脫慧解脫此中彼其等已生之惡不善法無餘滅此處有一類之人不作違犯之行不悔又如實不知彼之心解脫慧解脫此中彼其等已生之惡不善法無餘滅二施已而輕蔑者共住而輕蔑者輕信者不確信者鈍癡者三五之戰士喻人四五之乞食者五五之不後食者六五之一食者七五之糞掃衣者八五之但三依者九五之樹下住林者一五之樹下住者一一五之迴處坐者一二五之常坐者一三五之隨得座者一四五之塚間坐者六六人一此處先不隨聞諸法自現等覺諸諦又於彼處獲得一切智又於諸果成為自在性一類之人此處先不隨聞諸法自現等覺諸諦於彼處不獲一切智於諸果不成為自在性一類之人此處曾不隨聞諸法自現等覺諸諦於現法為苦之邊際為聲聞之最上一類之人此處先不隨聞諸法自現等覺諸諦於現法為苦之邊際不成為聲聞之最上一類之人此處先不隨聞諸法自現等覺諸諦於現法為苦之邊成為不還於現狀不來一類之人此處曾於不隨聞諸法自現等覺諸諦於現法不為苦之邊際成為一來還於現狀一類之人七七人一七水喻人是一次沈而沈下者浮出已而再沈下者浮出已而住立者浮出已而觀察省察者浮出已而前進者浮出已而得立足點者浮出已而度達彼岸且為住果之婆羅門二俱分解脫慧解脫身證見至信解隨法行隨信行八八人一四道具足之人四果具足之人九九人一等正覺獨覺俱分解脫慧解脫身證見至信解隨法行隨信行十十心一以五之此世為終者以五之此世為捨已而終者人施設論母畢第一章一人一如何是時解脫人耶此處有一類之人待時機而身證八解脫而住依其智慧見已一類之諸漏盡此云為時解脫人二如何是不時解脫人耶此處有一類之人不待時機而身證八解脫而住依其智慧見已而一類之諸漏盡此稱為不時解脫人於聖之解脫一切之聖人亦為不時解脫三如何是動法人耶此處有一類之人若得色俱行無色俱行之等至彼實不得隨欲之處不容易得不安易得於所欲處於欲之時於欲之間亦不入定亦不出定實又為其人之放逸以此等之等至而動搖此言為動法人四如何是不動法人耶此處有一類之人若得色俱行無色俱行之等至彼實得隨欲處不難得不苦得於欲處於欲時於欲之間亦入定亦出定於是其人之放逸此等之等至動搖亦無如此亦無興起此言為不動法人於聖之解脫一切之聖人等亦不動法五如何是退法人耶此處有一類之人若得色俱行無色俱行之等至彼實不得隨欲處不容易得不安易得於欲處欲之時欲之間亦不入定亦不出定實又因其人之放逸由此等之等至退有如是此云為退法人六如何是不退法人耶此處有一類之人若得色俱行無色俱行之等至彼實得隨意之欲處得不難得不苦得於欲處欲之時欲之間亦入定亦出定於是因其人之放逸由此等之等至退亦無如是亦無興起此稱為不退法人於聖之解脫一切之聖人等亦為不退法七如何是思不能人耶此處有一類之人若得色俱行無色俱行之等至彼實不得隨欲之處不容易得不安易得於欲處欲之時欲之間亦不入定亦不出定若彼專念者則由此等之等至不退若彼不專念由此等之等至退此言為思不能人八如何是護不能人耶此處有一類之人若得色俱行無色俱行之等至彼實不得隨意欲處不容易得不安易得於欲處欲之時欲之間亦不入定亦不出定若彼而防護者由此等之等至不退若彼而不防護者由此等之等至退此云為護不能人九如何為凡夫之人耶其人之三結不廢捨又斷彼等之結無特別之行向此稱為凡夫之人一如何是種性人耶於彼等法之等無間有聖法之出現具彼等之人此言為種性人一一一二如何為怖畏抑制人耶七有學及持戒之凡夫是怖畏抑制人阿羅漢是不怖畏抑制人一三如何是不能行人耶以具業障煩惱障異熟障而為不信無希望劣慧魯鈍彼等之人人是決定不能入於善法之正性此言為不能行之一四如何是能行人耶不具業障煩惱障異熟障而持信心希望智慧彼等之人人是決定能入於善法之正性此言為能行人一五一六如何是決定人耶持有五無間業之人及所有之邪見者是決定又八輩之聖人亦是決定其餘者為不決定人一七一八如何是四向人耶具足道之四人是四向之人具足果之四人是住於四果之人一九如何是首等人耶其人漏之盡滅與命終為非前非後此云為首等人二如何是住劫人耶以此人者是預流果能作證向者彼劫之燃燒時此人只要不證預流果者劫可無燃燒者此稱為住劫具足一切之道者亦言為住劫人二一二二如何是聖人耶八輩之聖人是聖其餘之人即非聖二三二五如何是有學人耶具足四道與三果者是有學人阿羅漢是無學其餘之人則非有學非無學二六如何是三明人耶具有三明者是三明人二七如何是六通人耶具有六通者是六通人二八如何是正自覺人耶此處有一類之人先未聞諸法而由身現等覺諸諦於是得一切智於諸果成為自在此言為正自覺人二九如何是獨覺人耶此處有一類之人先未聞諸法而由身現等覺諸諦於是不得一切智於諸果而未成自在此稱為獨覺人三如何是俱分解脫人耶此處有一類之人身證八解脫而住又依其智慧而見四諦已滅盡諸漏此名為俱分解脫人三一如何是慧解脫人耶此處有一類之人不身證八解脫而住又依其智慧而見四諦已滅盡諸漏此言為慧解脫人三二如何是身證人耶此處有一類之人身證八解脫而住又依其智慧而見四諦已滅盡一類之漏此稱為身證人三三如何是見至人耶此處有一類之人如實知此是苦如實知此是苦之集如實知此是苦之滅如實知此是至苦滅之道依如來所悟法之智慧而善見善行依其智慧而見四諦已滅盡一類之漏此言為見至人三四如何是信解人耶此處有一類之人如實知此是苦如實知此是苦之集如實知此是苦之滅如實知此是導至苦滅之道依如來所悟法之智慧而善見善行依其智慧而見四諦已滅盡一類之漏然而不如見至人之時此云為信解人三五如何是隨法行人耶彼之預流果能作證向人之慧根是殊勝推展智慧先立智慧而修聖道此稱為隨法人預流果能作證向人是隨法行人而入果者為見至人三六如何是隨信行人耶預流果能作證向人之信根是殊勝推展信先立信而修聖道此言為隨信行人預流果能作證向人是隨信行人而入於果者為信解脫人三七如何是極七返人耶此處有一類之人盡三結而為預流向不墮法決定等覺為終極者彼七次流轉於諸天人間之間輪迴而作苦之邊際此言為極七返人三八如何是家家人耶此處有一類之人盡三結而為預流向不墮法決定等覺為終極者彼流轉於二或三家輪迴而作苦之邊際此稱為家家人三九如何是一種人耶此處有一類之人盡三結而為預流向不墮法決定等覺為終極者彼生於世間之有而作苦之邊際此稱為一種人四如何是一來人耶此處有一類之人盡三結而使貪瞋癡稀少且入於一來果唯一次來世間而作苦之邊際此言為一來人四一如何是不還人耶此處有一類之人盡五順下分結而為化生者於彼處般涅槃而由彼世界不還此處者此云為不還人四二如何是中般涅槃人耶此處有一類之人盡五順下分結而為化生者於彼處般涅槃而由彼世界不還於此處者彼若生之等無間或不達於壽量之中斷上結而聖道生此稱為中般涅槃人四三如何是生般涅槃人耶此處有類之人盡五順下分結而為化生者於彼處般涅槃而由彼世界不還於此處者彼若超過壽量之中或至於死時斷上結而聖道生此言為生般涅槃人四四如何是無行般涅槃人耶此處有一類之人盡五順下分結而為化生者於彼處般涅槃而由彼世界不還來此處者彼是無行斷上結而聖道生此名為無行般涅槃人四五如何是有行般涅槃人耶此處有一類之人盡五順下分結而為化生者於彼處般涅槃而由彼世界不還來此處者彼以有行斷上結而聖道生此稱為有行般涅槃人四六如何是上流趣阿迦膩吒天人耶此處有一類之人盡五順下分結而為化生者於彼處般涅槃而由彼世界不還來此處者死於無煩天而行於無熱天死於無熱天而行於善現天死於善現天而行於阿迦膩吒天於阿迦膩吒天斷上結而聖道生此言為上流趣阿迦膩吒天人四七如何是預流預流果能作證向人耶隨斷滅三結之人是預流果能作證向人若彼人之斷滅三結此言為預流之人四八如何是一來一來果能作證向人耶隨稀薄貪欲與瞋恚者是一來果能證向人彼之貪欲與瞋恚至為稀薄者此稱為一來之人四九如何是不還不還果能作證向人耶斷貪欲與瞋恚無餘行向之人是不還果能作證向人彼人者斷貪欲與瞋恚不剩餘者此云為不還之人五如何是阿羅漢阿羅漢果能作證向人耶依斷除色貪無色貪慢掉舉無明而無餘之人是阿羅漢果能作證向人若彼斷除色貪無色貪慢掉舉無明而無餘者此言為阿羅漢第一章畢第二章二人一如何是忿之人耶此中忿者如何耶忿忿恨忿之狀態是瞋毀辱事毀辱狀態是惡意惱害敵意敵對狂暴之狀態暴惡心之不喜是言為忿不斷此忿之人是稱為忿人如何是有恨人耶此中恨者如何忿在前而恨續於後以恨猜恨之狀態忿之固定忿之不間斷忿之連續忿而堅固此言為恨不斷此恨之人是云為有恨之人二如何是有覆之人耶此中覆者如何是覆隱蔽隱蔽之狀態偽善偽善行為此言為覆不斷此覆之人此稱為有覆之人如何是有惱之人耶此中惱者如何是惱惱害惱害之狀態成為惱害諍論處成為鬥爭而不捨離者此言為惱不斷此惱是云為有惱之人三如何是有嫉之人耶此中嫉者如何是與他有關所得名聞尊重恭敬禮拜供養之嫉嫉之狀態羨慕羨羨之狀態此言為嫉不斷此嫉之人此稱為有嫉之人如何是有慳之人耶此中慳者如何是五慳住處之慳家族之慳所得之慳容色之慳法之慳也如此之慳慳之狀態貪婪吝吝嗇心之吝惜性此言為慳不斷此慳之人是云為有慳之人四如何是誑人耶此中誑者如何於此處有一類之人以誑而徧誑於彼處其誑誑之狀態詐偽虛偽欺瞞者此言為誑不斷此誑之人是稱為誑人如何是有諂之人耶此中諂者如何於此處有一類之人依身而行惡行依語而行惡行依意而行惡行為隱蔽彼等而懷惡願望想以勿知我語出勿知我以身動作勿知我如此有諂諂之狀態隱蔽欺瞞詐欺瞞著隱藏覆藏完全之覆藏隱蔽完全之隱蔽作不顯事作不明事隱伏惡行此言為諂不斷此諂之人是云為有諂之人五如何是無慚人耶此中無慚者如何是不慚應慚不慚具足於身之諸惡不善之法此言為無慚具足此無慚者稱為無慚人如何是無愧人耶此中無愧者如何是不愧應愧不愧具足於身之諸惡不善之法此名為無愧具足此無愧者云為無愧人六如何是惡言人耶此中惡言性者如何是有同法者之告言時以非法而為惡言惡言之狀態採取反對而樂敵對不尊敬不尊敬之狀態不尊重而任性此言為惡言性具足此惡言性之人是為惡言人如何是惡友人耶此中惡友性者如何是與不信破戒少聞慳惡慧其等人人之交往追隨侍奉交際親密尊敬尊重親近此言為惡友性具足此惡友性之人是為惡友人七如何是不護根門人耶此中不護根門人者如何於此處有一類之人以眼見色已而取相取狀由如此之作以不防護眼根而住時貪憂之惡不善法將流入為防護如此作而不修行不防護眼根不隨制御眼根以耳聞聲已乃至以鼻嗅香已乃至以舌味味已乃至以身觸觸已乃至以意知法已而取相取狀由如此之作以不防護意根而住時貪憂之惡不善法將流入為防護如此作而不修行不防護意根不隨制御意根不護此等六根不守護不制御此言為不護根門具足此等之不護根門者是為不護根門之人如何是食不知量人耶此中食不知量性者如何於此處有一類之人不思擇而不如理攝食為遊戲酒醉裝飾美麗之故於此對食物不滿足不知程度不思擇此言為不知量性具足此食不知量性者是為食不知量人八如何是失念人耶此中失念者如何是失念不隨念不專念無有記憶之狀態無有憶持之狀態不注意忘卻之狀態此言為失念具足此失念者是為失念人如何是不正知人耶此中不正知者如何是無智無見不現觀不覺不正覺不洞察心常不取完全不取不正確考察對此不善考察如在目前而不明確凡愚不正知強癡之愚迷亂於周圍全體無明無明之暴流無明之軛無明之隨眠執著於無明之狀態無明之橫木癡不善根此言為不正知具足此不正知者是為不正知人九如何是破戒人耶此中破戒者如何是與身有關之罪與語有關之罪與身語有關之罪此言為破戒一切之惡戒亦為破戒具足此破戒者是為破戒人如何是破見人耶此中破見者如何是無惠施無供養無祭祀亦無妙行惡行之業果無此世無彼世無母無父無化生之有情於世間沙門婆羅門之正至正行而於此世及彼世無自通達作證宣說如此之邪見邪見相遮見見違見之無秩序見之動轉見結攝取承受拘泥執著曲道邪道錯誤之狀態外道處顛倒而捉此言為破見具足此破見者是為破見人一如何是內結人耶其人不斷滅五順下分結此言為內結人如何是外結人耶其人不斷滅五順上分結此言為外結人一一如何是不忿人耶此中忿者如何是忿忿事乃至二一參照心之不喜此言為忿斷滅此忿者此言為不忿人如何是不恨人耶此中恨者如何是忿於前而恨續於後乃至二一參照以忿為堅固此言為恨斷滅此恨者此言為不恨人一二如何是不覆人耶此中覆者如何是覆隱蔽隱蔽之狀態偽善偽善行為此言為恨斷滅此恨者此為不覆人如何是不惱害人耶此中惱害者如何是惱害乃至二二參照此言為惱害滅此惱害者此言為不惱害人一三如何是不嫉人耶此中嫉者如何是與他有關所得名聞尊重恭敬禮拜供養之嫉爭嫉之狀態羨慕羨慕事羨慕之狀態此言為嫉斷滅此嫉者此言為不嫉人如何是不慳人耶此中慳者如何是五慳住處之慳家族之慳所得之慳容色之慳法之慳也如此之慳慳事慳之狀態貪婪吝吝嗇心之吝惜性此言為慳斷滅此慳者此言為不慳人一四如何是不誑人耶此中誑者如何於此處有一類之人以誑而徧誑於此其誑誑之狀態為誑詐偽虛偽欺瞞此言為誑斷滅此誑者是為不誑人如何是不諂人耶此中諂者如何於此處有一類之人依身而行惡行依語而行惡行依意而行惡行為隱蔽其等而懷惡意之願望願勿知我思勿知我語出勿知我身以勿知我而動作如此有諂之狀態隱蔽偽瞞欺詐瞞著隱藏完全之覆藏隱蔽完全之隱蔽作不顯事為不明事隱伏惡行此言為諂斷滅此諂者此言為不諂人一五如何是慚人耶此中慚者如何是慚應慚慚具足於身之諸惡不善之法此言為慚具足此慚者是為慚人如何是愧人耶此中愧者如何是愧應愧愧具足於身之諸惡不善之法此言為愧具足此愧者是為愧人一六如何是善言人耶此中善言性者如何是有同法者之告言時以如法而善言善言之狀態不取反對不好敵對採納彼等採納之狀態尊重尊敬此言為善言性具足此善言性者是為善言人如何是善友人耶此中善友性者如何是有信具戒多聞寬大具慧之人人侍奉事務奉事交通相交協力尊敬親近此言為善友性具足此善友性者是為善友人一七如何是護根門人耶此中護根門者如何是此處有一類之人以眼見色已而不執相不取狀由如此作不防護眼根而住時則貪憂之惡不善法將流入為防護如此而修行防護眼根從制御眼根以耳聞聲已乃至以鼻嗅香已乃至以舌味味已乃至以身觸觸已乃至以意知法已不執相不取狀由如此之作不防護意根而住時則貪憂之惡不善法將流入為防護如此故修行防護眼根從制御眼根守護此等六根防護防衛制御者此言為護根門具足護此等根門者是為護根門人如何是食知量人耶此中於食知量者如何於此處有一類之人思擇而如理攝食不為遊戲酒醉裝飾美麗只為滋養此身息飢渴之毀害以行梵行如是我斷故受而不令生新受又我應生存應無罪應住於安穩於此對食物有知足知量思擇此言為食知量具足此食知量者是為食知量人一八如何是樹立正念之人耶此中念者如何是念隨念記憶之狀態總持不散亂不忘卻性念念根念力正念此言為念具足此念者是為樹立正念之人如何是正知人耶此中正知者如何是智慧明智簡擇揀擇擇法見分伺察對察該博善巧深妙沈思思索近解解了智慧徧導者觀正知刺棒慧慧根慧力慧之武器慧之官殿慧之光明慧之光耀慧之光華慧之寶石無癡擇法正見此言為正知具足如此之正知者是為正知人一九如何是戒具足人耶此中具戒者如何關於身之無罪關於語之無罪關於身語之無罪此言為具戒一切之戒禁戒亦是具戒具足此具戒者是為戒具足人如何是見具足人耶此中具見者如何即有惠施供養祭祀亦有妙行惡行之業果有此世彼世有母有父有化生之有情於世間沙門婆羅門之正至正行而於此世及世自通達作證宣說如此之智慧明智乃至二一八參照無癡擇法正見此言為具見一切之正見亦是具見具足此見者是為見具足人二如何是於世間難得之二種人耶一者則先施恩之人他者是知恩感恩之人此等於世間是難得之二種人二一如何是難滿足之二種人耶一者隨得而積蓄之人他者隨得而捨之人此等為難滿足之二種人二二如何是易滿足之二種人耶一者則隨得而不積蓄之人他者隨得而不捨之人此等為易滿足之二種人二三如何是增漏之二種人耶一者悔不應悔之人他者不悔應悔之人此等為增漏之二種人二四如何是不增漏之二種人耶一者不悔不應悔之人他者悔應悔之人此等為不增漏之二種人二五如何是劣意向人耶此處有一類之人為破戒惡法親近倚親給侍於彼他之破戒惡法人此言為劣意向人如何是勝意向人耶於此處有一類之人為具足戒善法親近倚親給侍於彼他具戒之善法人此言為勝意向人二六如何是自足人耶是獨覺與如來之聲聞阿羅漢是為自足人等正覺者是自足人而為他足人第二章畢第三章三人一如何是無希望人耶於此處有一類之人以破戒而為惡法以不淨而為疑之行狀作陰蔽之業非沙門而自稱為沙門非淨行者而自稱為淨行者內生朽廢漏泄污穢彼聞實有某名之比丘由漏盡而無漏之心解脫慧解脫於現法自證知作證具足而住然而彼不如是思惟言何時耶我亦由漏盡而乃至具足而住耶此言為無希望人如何是正希望人耶於此處有一類之人以具戒而為善法彼聞實有某名之比丘由漏盡而無漏之心解脫慧解脫於現法自證知作證具足而住然而彼如是思惟言何時耶我亦由漏盡而乃至應具足而住耶此言為正希望人如何是離希望人耶於此處有一類之人由漏盡而無漏之心解脫慧解脫於現法自證知作證具足而住彼聞實有某名比丘由漏盡而乃至具足而住然而彼如是不思惟言何時耶我亦由漏盡乃至應具足而住耶是何故耶先不解脫而彼解脫之希望耶則今止息於彼此言為離希望人二如何是三病喻人耶有三種病人於此處有一類之病人雖得滋養食或不得滋養食雖得有效驗之醫藥或不得有效驗之醫藥雖得適當之看護人或不得適當之看護人不癒其病此處復有一類之病人雖得滋養食或不得滋養食雖得有效驗之醫藥或不得有效驗之醫藥雖得適當之看護人或不得適當之看護人而癒其病於此處復有一類之病人雖得非得滋養食雖得非得有效驗之醫藥雖得非得適當之看護人而癒其病於此處復有一類人得非得滋艱食得非得効之醫食得非得適當之看護人而癒其病此中以病人而得非得滋養食得非得有效驗之醫藥得非得適當之看護人有人其病癒因於此病人故世尊制定病者之食制定病者之藥制定病者之看護人又因於此病人故其他二種之病人亦應看護如是此等之三病喻人者有存於世三者誰耶此處有一類之人雖得見奉如來或不得見奉如來雖得聽如來所說之法律或不得聽如來所說之法律於諸善法不入於正性決定此處復有一類之人雖得見奉如來或乃至雖不得聽於諸善法入於正性決定此處復有一類之人雖得非得見奉如來雖得非得聽如來所說之法律於諸善法入於正性決定此中得非得見奉如來得非得如來所說之法律於諸善法入於正性決定之人因於此人故世尊制定說法又因於此人故其他二種人亦應為說法此等之三病喻人亦存在世三如何是身證人耶於此處有一類之人身證八解脫而住又依其智慧而見四諦已以滅盡諸漏此言為身證人如何是見至人耶於此處有一類之人如實知此是苦乃至一三三參照如實知此是導至苦滅之道善見善行依其如來所悟之法依其智慧而見四諦已以滅盡諸漏之一類此言為見至人如何是信解人耶於此處有一類之人如實知此是苦乃至一三四參照滅盡諸漏然而不如見至人此言為信解人四如何是糞語人耶於此處有一類之人若赴於公會若行於民眾若往返於親屬之間若赴於組合員之中若往返於親屬之間若赴於組合員之中若行於法廷之中召喚為作證人訊問來親者語所知彼不知而云我知或知而云我不知不見而云我見見而云我不見如此若為自己若為他人若為任何少許之利益以正知而語虛妄此言為糞語人如何是華語人耶於此處有一類之人斷滅虛妄語遠離虛妄語若赴於公會若至於民眾若往親屬之間若赴於組合員之中若行於法廷之中召喚為作證人訊問來親者語所知彼不知而云我不知或知而云我知或不見而云我不見或見而云我見如此若為自己若為他人若為任何少許之利益以正知而不語虛妄此言為華語人如何是蜜語人耶於此處有一類之人所有之言無過失樂耳愉快而透徹於心底優雅而多人之愛好多人之所悅語如是之語此言為蜜語人五如何是漏瘡喻心之人耶於此處有一類之人易怒多擾惱雖少言而現結怨憤怒於凶勃狠戾憤發憎惡憂惱譬如惡漏瘡者以棒尖或瓦礫敲打膿血越發漏泄如是此處有一類之人易怒乃至現憂惱此言為漏瘡喻心之人如何是電光喻心之人耶於此處有一類之人如實知此是苦乃至三三參照如實知此是導至苦滅之道譬如有眼者於夜黑暗中電光之間得見於物如是此處有一類之人乃至知此言為電光喻心之人如何是金剛喻心之人耶於此處有一類之人由漏盡而無漏之心解脫慧解脫慧解脫於現法自證知作證具足而住譬如金剛能斷珠石如無任何物者如是此處有一類人由漏盡而乃至具足而住此言為金剛喻心之人六如何是盲人耶於此處有一類之人無眼即如能得未得之財物或增殖已得之財物無有其眼又彼能知善不善之法能知有罪無罪之法能知劣勝之法能知黑白相對之法無有其眼是言為盲人如何是一眼人耶於此處有一類之人有眼即如能得未得之財物或增殖已得之財物有其眼又彼能知善不善之法能知有罪無罪之法能知黑白相對之法無有其眼此言為一眼人如何是兩眼人耶於此處有一類之人有眼即如能得未得之財物或增殖已得之財物有其眼又彼能知善不善之法能知有罪無罪之法能知黑白相對之法有其眼此言為兩眼人七如何是覆慧人耶於此處有一類之人屢次往詣僧園於比丘等之前欲聽法比丘等為彼說法初善中善後善有義有文純一圓滿清淨開示梵行然而彼坐於其座不思惟彼所說之初不思惟中不思惟後又由其座而起彼所說之初乃至不思惟後猶如注於覆瓶之水者流出不留於其處如是此處有一類之人屢次往詣僧園乃至不思惟後此言為覆慧人如何是膝慧人耶於此處有一類之人屢次往詣僧園於比丘等之前欲聽法比丘等為彼說法初善中善後善有義有文純一圓滿清淨開示梵行然而彼坐於其座思惟彼所說之初思惟中思惟後又由其座而起不思惟其所說之初不思惟中不思惟後猶如將種種之胡麻硬米糖果棗子列置於人膝上彼失念而由其座起而令其墜落如是此處有一類之人屢次往詣僧園乃至不思惟後此言為膝慧人如何是廣慧人耶於此處有一類之人屢次往詣僧園乃至思惟後又由其座而起思惟彼所說之初思惟中思惟後猶如注於立瓶之水者留於其處而不流出如是此處有一類之人屢次往詣僧園乃至亦思惟後此言為廣慧人八如何是於欲與有之未離欲人耶於預流與一來此等即言為於欲與有之未離欲人如何是於欲之離欲而於有之未離欲人耶是不還者此言為於欲之離而於有之未離欲人如何是於欲與有之離欲人耶是阿羅漢此言為於欲與有之離欲人九如何是石刻喻人耶於此處有一類之人有種種之忿怒而其忿怒彌久永附隨於彼譬如石上之彫刻若因風因水而不迅速消失永久存在如是此處有一類之人乃至附隨於彼此言為石刻喻人如何是地刻喻人耶於此處有一類之人有種種之忿怒而其忿怒彌久永不附隨於彼譬如地上之痕跡若因風因水而迅速消失不永久存在如是此處有一類之人乃至不附隨於彼此言為地刻喻人如何是水刻喻人耶於此處有一類之人雖強言或粗暴言亦非可意之言無言中之言有理而歡喜譬如水上之痕跡者迅速消失不永久存在如是此處有一類之人乃至歡喜此言為水刻喻人一如何為三樹皮衣喻人耶有三種之樹皮衣一樹皮衣者雖是新而色澤壞又或觸麤糙且價值少二樹皮衣者雖是中古而色澤壞又或觸麤糙且價值少三樹皮衣者使用老舊而色澤壞又感觸麤糙且價值少使用陳舊之樹皮衣者或使用於單拭或投棄於塵堆之中如是於比丘等之中有可喻此等三種樹皮衣之人存在三者如何若新比丘無戒而惡法者此是彼色澤之惡劣猶如彼之樹皮衣色澤之惡劣此人亦然又與彼交往親近倣效彼動作之人為此經長夜招來不饒益與痛苦此乃彼觸之麤糙猶如彼樹皮衣之感觸麤糙此人亦然又施捨衣食牀座病緣藥資具於彼為此能施者於彼無大果無大勝利此是彼之價值少猶如彼樹皮衣之價值少此人亦然又若中年之比丘乃至長老之比丘以無戒而惡法此是彼之色澤惡劣猶如彼樹皮衣之色澤惡劣此人亦然又與彼交往親近倣效於彼動作之人此經長夜招來不饒益與痛苦此是彼者之感觸麤糙猶如彼樹皮衣之感觸麤糙此人亦然又施捨衣食牀座病緣藥資具於彼為此能施者於彼無大果無大勝利此是彼之價值少猶如彼樹皮衣之價值少此人亦然若如此之長老比丘於僧伽中而語者對此而比丘等如此言汝是以如何愚癡暗昧者之言汝亦為有所言耶彼乃忿怒不歡而發語僧伽即應對而語宛如棄彼樹皮衣於塵堆中捨棄彼語此等可喻於三種樹皮衣之人存在於比丘中一一如何是三迦尸迦衣喻耶有三種迦尸迦衣一新迦尸迦衣是有色澤觸之細滑而價值又大二中古迦尸迦衣是亦有色澤觸之細滑而價值又大三使用陳舊之迦尸迦衣是亦有色澤觸之細滑而價值又大人人雖使用陳舊之迦尸迦衣或似裹寶或蓄此於香篋之中如此於比丘等之中此等可喻於三種迦尸迦衣之人存在三者如何若新比丘而持戒善法此是彼之妙色猶如彼迦尸迦衣有色澤此人亦然又與彼交往親近倣效彼行道之人因此招來長夜之饒益安樂此是觸彼而細滑猶如觸彼迦尸迦衣之細滑此人亦然又施捨衣食牀座病緣藥資具於彼人彼有大果有大勝利此是彼之價值大猶如彼迦尸迦衣之價值大此人亦然又若中年之比丘乃至長老之比丘而持戒善法此是彼之妙色猶如彼迦尸迦衣是有色澤此人亦然又與彼交往親近倣效彼行動之人因此招來長夜之饒益安樂此是之觸彼細滑猶如觸彼迦尸迦衣之細滑此人亦然又施捨衣食牀座病緣藥資具於彼人因此彼有大果有大勝利此是彼之價值大猶如彼迦尸迦衣之價值大此人亦然若如此之長老比丘於僧伽中有所言對此比丘等如是而言具壽眾肅靜長老比丘將語法與律彼之言語如香篋中之彼迦尸迦衣蓄至於心中此等可喻三種之迦尸迦衣之人有存在於比丘中一二如何是易計量人耶於此處有一類之人傲慢自滿輕躁饒舌談散漫失念不正知心不定心散動而放縱諸根此言為容易計量之人如何是難計量人耶於此處有一類之人不傲慢不自滿不輕躁不饒舌不談散漫正念正知心定心之專注而擁護諸根此言為難計量之人如何是無計量人耶於此處有一類之人由諸漏滅盡而無漏之心解脫慧解脫於現法自證知作證具足而住此言為不可計量之人一三如何是不可親近不可倚親不可伺候之人耶於此處有一類之人於戒定慧卑劣如是之人不可親近不可倚親不可伺候除憫與悲如何是可親近可倚親可伺候之人耶於此處有一類之人於戒定慧等同如是之人可親近可倚親可侍候何故耶可語戒相等之善人與我等語戒又其戒之談話我等可生安樂又其依戒之談話戒可轉我等可語定相等之善人與語定又其定之談話於我等可生安樂又其依定談話定者可轉我等可言慧相等之善人與我等語慧又其慧之談話於我等可生安樂又其依慧之談話慧者可轉我等故如此之人可親近可倚親可侍候如何是恭敬尊重可親近可倚親可侍候之人耶於此處有一類之人於戒定慧殊勝如此之人是可恭敬尊重可親近可倚親可侍候何故耶如是我可令未圓滿之戒蘊圓滿已圓滿之戒蘊以慧順益彼彼或令未圓滿之定蘊圓滿或令已圓滿之定蘊以慧順益彼彼或令未圓滿之慧蘊圓滿或令已圓滿之慧蘊以慧順益彼彼故如是之人是可恭敬尊重可親近可倚親可侍候一四如何是可厭棄之人不可親近不可倚親不可侍候耶於此處有一類之人以破戒而為惡法不淨惹起疑惑之行狀作陰蔽之業非沙門而稱為沙門非淨行者而稱為淨行者於內生朽廢漏泄污穢如是之人是可厭棄不可親近不可倚親不可侍候何故耶譬如雖不墮於如此人之見解尚且彼惡名聲揚以彼惡人為友以惡人為朋尊敬惡人猶如進入糞中之蛇雖不咬人尚污穢人正是如此譬如雖不墮於此人之見解尚且彼惡名聲揚即以彼惡人為友以惡人為朋尊敬惡人是故如此之人可厭棄不可親近不可倚親不可侍候如何是可捨棄不可親近不可侍親不可侍候之人耶於此處有一類之人易忿怒而多擾惱雖少言而結怨憤怒於凶丈敖現狠戾憤發憎惡與擾惱猶如惡漏瘡以棒尖或瓦礫敲打多量濃血漏泄如是此處有一類人易忿怒多擾惱乃至猶如鎮頭迦樹之燃燒作火以棒尖或瓦礫擾亂則越發發出咭咭噠咕咭咭噠之音正實如此此處有一類之人易忿怒而多擾惱乃至猶如糞坑以棒尖或互礫攪亂則越發出惡臭正實如是於此有一類人易怒多擾惱雖少言而結怨憤怒凶敖現狠戾憤發憎惡與擾惱如此之人是可捨棄不可親近不可倚親不可侍候何故耶彼謂彼是毀辱我彼是呵駡我彼是損害於我故如此之人可捨棄不可親近不可倚親不可侍候如何是可親近可倚親可侍候之人耶於此處有一類人以持戒作為善法如此之人是可親近可倚親可侍候何故耶譬如雖隨從如此人之見解尚且彼善良之名聲揚即以彼善人為友以善人為朋尊敬善人故如此之人是可親近可倚親可侍候一五如何是完全於行戒而於行一分定與慧之人耶是預流一來此等言完全行於戒而於行一分定與慧之人如何是完全於行戒與定而於行一分慧之人耶是不還者此言為完全於行戒與定而於行一分慧之人如何是完全於行戒定慧之人耶是阿羅漢此言為完全於行戒定慧之人一六此處如何是三師耶於此處有一類之師是施設欲之徧智不施設色之徧智不施設受之徧智於此處有一類之師是施設欲之徧智施設色之徧智不施設受之徧智於此處有一類之師是施設欲之徧智施設色之徧智施設受之徧智此中施設欲之徧智不施設色之徧智不施設受之徧智之師是依彼無不見得色界等至之師此中施設欲之徧智施設色之徧智不施設受之徧智之師是依彼無不見得無色界等至之師此中施設欲之徧智施設色之徧智施設受之徧智之師是依彼無不見正自覺者之師此等是三師一七如何亦為他之三師耶於此處有一類之師於現法我是施設實真又於當來我施設實真此處有一類之師於現法我是施設實真於當來我不施設實真此處有一類之師於現法我是不施設實真於當來我亦不施設實真此中於現法我施設實真於當來我亦施設實真之師依彼無不見常住論之師此中於現法我雖施設實真於當來我不施設實真之師依彼無不見斷論之師此中於現法我不施設實真於當來我亦不施設實真之師依彼無不見為正自覺者之師此等是其他之三師第三章畢第四章四人一如何是不善士人耶於此處有一類之人是殺生者不與取者欲邪行者虛誑語者有穀酒木酒之酒精分放逸處者此言為不善士人如何是由不善士更為不善士之人耶於此處有一類之人自身是殺生者而又勸他人亦殺生自身是不與取者而又勸他人亦不與取自身是欲邪行者而又勸他人亦欲邪行自身是虛誑語者而又勸他人亦虛誑語自身是有穀酒木酒之酒精分放逸處者而又勸他人為有穀酒木酒之酒精分放逸處此言自不善士更為不善士之人如何是善士之人耶於此處有一類之人遠離殺生不與取欲邪行離虛誑語離穀酒木酒之酒精分放逸處此言為善士之人如何是自善士更為善士之人耶於此處有一類之人自身遠離殺生而又勸他人遠離殺生自身遠離不與取而又勸他人遠離不與取自身遠離欲邪行而又勸他人遠離欲邪行自身遠離虛誑語而又勸他人遠離虛誑語自身遠離有穀酒木酒之酒精分放逸處而又勸他人遠離有穀酒木酒之酒精分放逸處此言為自善士更為善士之人二如何是惡人耶於此處有一類之人殺生者不與取者欲邪行者虛誑語者離間語者麤惡語者雜穢語者有貪欲有瞋恚心邪見者此言為惡人如何是自惡人更為惡人之人耶於此處有一類之人自身為殺生者而又勸他人殺生自身為不與取者而又勸他人不與取自身為欲邪行者而又勸他人欲邪行自身為虛誑語者而又勸他人虛誑語自身為離間語者而又勸他人離間語自身為麤惡語者而又勸他人麤惡語自身為雜穢語者而又勸他人雜穢語自身有貪欲而又勸他人貪欲自身有瞋恚心而又勸他人瞋恚心自身為邪見者而又勸他人邪見此言為自惡人更為惡人之人如何是善士耶於此處有一類之人遠離殺生遠離不與取遠離欲邪行遠離虛誑語遠離離間語遠離麤惡語遠離雜穢語無貪欲者無瞋恚心者正見者此言為善人如何是自善人更為善人之人耶於此處有一類之人自身遠離殺生而又勸他人遠離殺生自身遠離不與取而又勸他人遠離不與取自身遠離欲邪行而又勸他人遠離欲邪行乃至勸告他人正見此言為自善人更為善人之人三如何是惡法人耶於此處有一類之人殺生者乃至前節參照邪見此言為惡法人如何是自惡法更為惡法之人耶於此處有一類之人自身為殺生者而又勸他人殺生乃至前節參照勸邪見此言為自惡法更為惡法之人如何是善法人耶於此處有一類之人遠離殺生乃至前節參照正見者此言為善法人如何是自善法更為善法之人耶於此處有一類之人自身遠離殺生而又勸他人遠雜殺生乃至前節參照勸告正見此言為自善法更為善法之人四如何是有罪人耶於此處有一類之人具足有罪之身業具足有罪之語業具足有罪之意業此言為有罪人如何是多罪人耶於此處有一類之人具足多分有罪之身業而無罪之身業少具足多分有罪之語業而無罪之語業少具足多分有罪之意業而無罪之意業少此言為多罪人如何是少罪人耶於此處有一類之人具足多分無罪之身業而有罪之身業少具足多分無罪之語業而有罪之語業少具足多分無罪之意業而有罪之意業少此言為少罪人如何是無罪人耶於此處有一類之人具足無罪之身業具足無罪之語業具足無罪之意業此言為無罪人五如何是略開知人耶於於其人所說之同時有法現觀此言為略開知人如何是廣演知人耶於廣說於其人所略說之義而有法現觀此言為廣演知人如何是引導人耶於其人所說與所問且有如理作意親近倚親侍候於善友如此依次而有法現觀此言為所引導人如何是文句為最人耶其人是多聞多話多受持多語而且生存中無法現觀此言為文句為最人六如何是以相應辯而非自在辯之人耶於此處有一類之人受質問而適切回答但不迅速此言為相應辯而非自在辯之人如何是自在辯而非相應辯之人耶於此處有一類之人受質問而迅速回答但不適切此言為自在辯而非相應辯之人如何是相應辯而自在辯之人耶於此處有一類之人受質問而適切迅速回答此言為相應辯而自在辯之人如何是非相應辯非自在辯之人耶於此處有一類之人受質問時亦不適切亦不迅速作答此言為非相應辯非自在辯之人七此中如何是四說法人耶於此處有一類之說法者僅有少說又不得要領如此彼聽眾即不能善巧判斷其所說法得要領或不得要領如此之說法者對如此聽眾說法當被見棄此處有一類之說法者僅有少說法得其要領如此彼之聽眾能善巧判斷其所說法有得其要領或不得要領者如此之說法者對如此聽眾之說法當被見棄此處亦有一類之說法者人數眾多言不得要領如此彼聽眾不能善巧判斷其所說法得其要領或不得要領者如此之說法者對於如此聽眾之說法當被見棄此處亦有一類之說法者人數眾多又說得其要領如此彼聽眾不能善巧判斷其所說法得其要領或不得要領者如此之說法者對於如此聽眾之說法當被見棄八此中如何是四雲喻人耶是有四雲鳴而不雨雨而不鳴鳴而又雨不鳴又不雨正是如此可比喻此等四雲之人於世有存在四者如何是鳴而不雨雨而不鳴鳴而又雨不鳴又不雨如何是鳴而不雨之人耶於此處有一類之人說而不作如此之人是鳴而不雨猶如彼雲鳴而不雨此人亦然如何是雨而不鳴之人耶於此處有一類之人作而不說如是之人是雨而不鳴猶如彼雲雨而不鳴此人亦然如何是鳴而又雨之人耶於此處有一類之人說而又作如此之人是鳴而又雨猶如彼雲鳴而又雨此人亦然如何是不鳴又不雨之人耶於此處有一類之人不說又不作如此之人是不鳴又不雨猶如彼雲不鳴又不雨此人亦然九此中如何是四鼠喻人耶有四種鼠掘穴而不住住而不掘穴掘穴而又住不掘穴又不住如此於世間有比喻於此等四鼠之人存在四者如何掘穴而不住住而不掘穴掘穴而又住不掘穴又不住如何是掘穴而不住之人耶於此處有一類之人通達契經應頌記說諷頌無問自說如是說本生未曾有法吠陀羅法彼如實不知此是苦不如實知此是苦之集不如實知此是苦之滅如實不知此是導至苦滅之道如此之人是掘穴而不住猶如彼鼠掘穴而不住此人亦然如何是住而不掘穴之人耶於此處有一類之人不通達於契經乃至吠陀羅法彼如實知此是苦乃至如實知此是導至苦滅之道如此之人是住而不掘穴猶如彼鼠住而不掘穴此人亦然如何是掘穴而又住之人耶於此處有一類之人通達於契經乃至吠陀羅法彼如實知此是苦乃至如實知此是導至苦滅之道如此之人則是掘穴而又住之人猶如彼鼠掘穴而又住此人亦然如何是不掘穴又不住之人耶於此處有一類之人不通達契經乃至吠陀羅法彼不如實知此是苦乃至不如實知此是導至苦滅之道如此之人是不掘穴不住之人猶如彼鼠不掘穴又不住此人亦然於世間有比喻此等鼠之四種人之存在一此中如何是四菴摩羅果喻人耶有四種菴摩羅果有生而色熟熟而色生生而色生熟而色熟如是於世間有比喻此等四種菴摩羅果之人存在四者如何有生而色熟熟而色生生而色生熟而色熟如何是有生而色熟之人耶於此處有一類之人持往來前觀左右視屈伸僧伽梨衣鉢端正彼不如實知此是苦乃至不如實知此是導至苦滅之道如此之人是生而色熟之人猶如彼菴摩羅果生而熟色此人亦然如何是有熟而色生之人耶於此處有一類之人持往來前觀左右視屈伸僧伽梨衣鉢不端正彼如實知此是苦乃至如實知此是導至苦滅之道如此之人乃是熟而色生之人猶如彼菴摩羅果熟而色生此人亦然如何是生而色生之人耶於此處有一類之人持往來乃至僧伽梨衣鉢不端正彼不如實知此是苦乃至不如實知此是導至苦滅之道如此之人是生而色生之人猶如彼菴摩羅果生而色生此人亦然如何是熟而色熟之人耶於此處有一類之人持往來乃至僧伽梨衣鉢端正彼如實知此是苦乃至如實知此是導至苦滅之道如此之人是熟而色熟之人猶如彼菴摩羅果熟而色熟此人亦然於世間有可比喻此等四種菴摩羅果之人存在一一此中如何是四瓶喻人耶有四種瓶空而閉滿而開空而開滿而閉如此於世間有可比喻此等四種瓶之人存在四者如何是空而閉滿而開空而開滿而閉如何是空而閉之人耶於此處有一類之人持往來乃至衣鉢端正彼不如實知此是苦乃至不如實知至此是導苦滅之道如此之人是空而閉之人猶如彼瓶空而閉此人亦然如何是滿而開之人耶於此處有一類之人持往來乃至衣鉢不端正彼如實知此是苦乃至如此之人是滿而開之人猶如彼瓶滿而開此人亦然如何是空而開之人耶於此處有一類之人持往來乃至不端正彼不如實不知此是苦乃至如此之人是空而開之人猶如彼瓶空而開此人亦然如何是滿而閉之人耶於此處有一類之人持往來乃至端正彼如實知此是苦乃至如此之人是滿而閉之人猶如彼瓶滿而閉此人亦然如此於世間有可比喻此等四種瓶之人存在一二此中如何是四池喻人耶有四種池淺而見深深而見淺淺而見淺深而見深如此於世間有可比喻此等四種池之人存在四者如何淺而見深深而見淺淺而見淺深而見深者如何是淺而見深之人耶於此處有一類之人持往來乃至四一參照端正彼不如實知此是苦乃是如此之人是淺而見深之人猶如池淺而見深此人亦然如何是深而見淺之人耶於此處有一類之人持往來乃至不端正彼如實知此是苦乃至如此之人是深而見淺之人猶如彼池深而見淺此人亦然如何是淺而見淺之人耶於此處有一類之人持往來乃至不端正彼不如實知此是苦乃至如此之人是淺而見淺之人猶如彼池淺而見淺此人亦然如何是深而見深之人耶於此處有一類之人持往來乃至端正彼如實知此是苦乃至如此之人是深而見深之人猶如彼池深而見深此人亦然於世間有可比喻此等四種池之人存在一三此中如何是四軛牛喻人耶有四種軛牛我之牛群凶惡他者之牛群不凶惡他者之牛群凶惡我之牛群不凶惡我之牛群凶惡而他者之牛群亦凶惡我之牛群不凶惡而他者之牛群亦不凶惡如此於世間有可比喻四種軛牛之人存在四者如何即我之牛群凶惡他者之牛群不凶惡他者之牛群凶群我之牛群不凶惡我之牛群凶惡而他者之牛群亦凶惡我之牛群不凶惡而他者之牛群亦不凶惡如何是我之牛群凶惡他者之牛群不凶惡之人耶於此處有一類之人令自己之徒眾戰慄而非他之徒眾如此之人是我之牛群凶惡他者之牛群不凶惡猶如彼牛我之牛群凶惡他者之牛群不凶惡此人亦然如何是他者之牛群凶惡我之牛群不凶惡之人耶於此處有一類之人令他者之徒眾戰慄而非自己之徒眾如此之人是他者之牛群凶惡我之牛群不凶惡猶如彼之牛他者之牛群凶惡我之牛群不凶惡此人亦然如何是我之牛群凶惡而他者之牛群亦凶惡之人耶於此處有一類之人令自己之徒眾戰慄而又令他者之徒眾戰慄如此之人是我之牛群凶惡而他者之牛群亦凶惡猶如彼之牛我之牛群凶惡而他者之牛群亦凶惡此人亦然如何是我之牛群不凶惡而他者之牛群亦不凶惡之人耶於此處有一類之人不令自己之徒眾戰慄又不令他者之徒眾戰慄如此之人是我之牛群不凶惡而他者之牛群亦不凶惡猶如彼之牛我之牛群不凶惡而他者之牛群亦不凶惡此人亦然於世間有可比喻此等四種軛牛之人存在一四此中如何是四蛇喻人耶有四種之蛇毒出而毒不激毒雖激而毒不出毒出而毒又激毒不出毒亦不激如此於世間有可比喻此等四種蛇之人存在四者如何毒出而毒不激毒雖激而毒不出毒出而毒又激毒不出毒亦不激如何是毒出而毒不激之人耶於此處有一類之人雖數數忿怒但彼忿怒長夜不長久持續如此之人是毒出而毒不激猶如彼蛇之毒出而毒不激此人亦然如何是毒雖激而毒不出之人耶於此處有一類之人雖不數數忿怒但彼之忿怒長夜長久持續如此之人是毒雖激但毒不出猶如彼蛇之毒雖激但毒不出此人亦然如何是毒出而毒又激之人耶於此處有一類之人數數忿怒而彼之忿怒又長夜長久持續如此之人是毒出而毒又激猶如彼蛇之毒出而毒又激此人亦然如何是毒不出而毒又不激之人耶於此處有一類之人勿數數忿怒而彼之忿怒又不長夜長久持續如此之人是毒不出而毒又不激之人猶如彼蛇之毒不出而毒又不激此人亦然於世間有可喻此等四種蛇之人存在一五如何是不查不究而稱讚不應稱讚之人耶於此處有一類之人稱讚說惡向行邪向行之外道外道之聲聞亦言為善向行正向行如此之人是不查不究而稱讚不應稱讚者如何是不查不究而不稱讚應稱讚者之人耶於此處有一類之人不稱讚說善向行正行向行之佛陀佛陀之聲聞亦言為惡向行邪向行如此之人是不查不究而不稱讚應稱讚者如何是不查不究而不應信處生信之人耶於此處有一類之人於惡向道邪向道之處生信亦於善向道或正向道者如此之人是不查不究而於不應信之處生信者如何是不查不究而於應信之處生不信之人耶於此處有一類之人於善向道正向道之處生不信亦於惡向道或邪向道者如此之人是不查不究而於應信之處生不信者一六如何是查究不稱讚不應稱讚之人耶於此處有一類之人不稱讚語惡向行邪向行之外道外道之聲聞亦言惡向行邪向行者如此之人是查究而不稱讚不應稱讚者如何是查究稱讚應稱讚者之人耶於此處有一類之人稱讚語善向行正向行之佛陀佛陀之聲聞亦言為善向行正向行如此之人是查究而稱讚應稱讚者如何是查究而於不可信之處生不信之人耶於此處有一類之人於惡向道邪向道之處生不信亦於惡向道或邪向道者如此之人是查究而於不可信之處生不信如何是查究而於可信之處生信之人耶於此處有一類之人於善向道正向道之處生信亦於惡向道或邪向道者如此之人是查究而於可信之處生信者一七如何是其時有不應稱讚者真實正當不稱讚其時有可稱讚者真實正當不稱讚之人耶於此處有一類之人有稱讚亦有不稱讚者其時有不稱讚者真實正當說之其時有其中稱讚者真實正當不說之如此之人是其時有真實正當稱讚不可稱讚者其時有真實正當不稱讚者如何是其時有應稱讚者真實正當稱讚之其時有不應稱讚者真實正當非不稱讚之人耶於此處有一類之人有稱讚亦有不稱讚者其時有其中稱讚者真實正當說之其時又有其中不稱讚者真實正當不說之如此之人乃是其時有應稱讚者真實正當地稱讚之其時有不應稱讚者真實正當非不稱讚之之人如何是其時有不應稱讚者真實正當不稱讚之其時有應稱讚者真實正當稱讚之人耶於此處有一類之人有稱讚亦有不稱讚者其時有其中不稱讚者真實正當說之其時有其中稱讚者真實正當說之於彼之問答時知之如此之人則是其有不可稱讚者真實正當不稱讚之其時有可稱讚者真實正當稱讚之如何是其時有不應稱讚者真實正當非不稱讚之其時有應稱讚者真實正當不稱讚之人耶於此處有一類之人有稱讚亦有不稱讚者其時有其中不稱讚者真實正當不說之其時有其中稱讚者真實正當不語之以捨而為正念正知如此之人是其時有不應稱讚者真實正當地亦非不稱讚其時有應稱讚者真實正當不稱讚之一八如何依起策之果而生活依功德之果而不生活之人耶其人之生活乃是由起策勤勉精進之結果而非依功德也此言之為依起策之果而生活不依功德之果而生活之人如何是依功德之果而生活不依起策之果而生活之人耶是以他化自在天為起其以上之諸天乃是依功德之果而生活不依起策之果而生活如何是依起策之果而生活又依功德之果而生活之人耶是其人之生活是由起策勤勉精進之結果又由功德之結果此是依起策之果而生活又依功德之果而生活之人如何是不依起策之果而生活又不依功德之果而生活之人耶是地獄者等是不依起策之果而生活亦不依功德之果而生活一九如何是以闇而趣闇之人耶於此處有一類之人下賤之家即若生於旃陀羅之家獸獵人之家竹匠之家車匠之家塵芥淨除之家貧窮而飲食窮乏生計困難辛苦始得衣服又彼血色不好容貌衰弱身體短小多病或隻眼或手不具或跛或躄不得食物飲食衣服車乘鬘香塗香床住家燈具彼是以身行惡行以語行惡行以意行惡行彼是以身行惡行而終以語行惡行而終以意行惡行而終身壞死後而生於無幸處惡趣險難地獄如此言為以闇而趣闇之人如何是以闇而趣明之人耶於此處有一類之人下賤之家乃至不得床住家燈具彼是以身行妙行以語行妙行以意行妙行彼即是以身行妙行而終以語行妙行而終以意行妙行而終於身壞死後而生於善趣天界如此是為以闇而趣明之人如何是以明而趣闇之人耶於此處有一類之人尊貴之家即若生於剎帝利大家婆羅門大家長者大家豐富而多貨擁有大祿有多金銀資產雜具與財物有稻穀又彼美麗而堪見令人喜歡他而成就最上之姿色乃至得床住家燈具彼是以身行惡行乃至以意行惡行而終於身壞死後而生於無幸處惡趣險難地獄如此是為以明而趣闇之人如何是以明而趣明之人耶於此處有一類之人尊貴之家乃至得床住家燈具彼是以身行妙行乃至以意行妙行而終於身壞死後而生善趣天界如此是為以明而趣明之人二如何是以今下而為當來下之人耶乃至四一九參照如此是為以今下而為當來下之人如何是以今下而為當來上之人耶乃至四一九參照如此是為以今下而為當來上之人如何是以今上而為當來下之人耶乃至四一九參照如此是為以今上而為當來下之人如何是以今上而為當來上之人耶乃至四一九參照如此是為以今上而為當來上之人也二一此處如何是四樹喻人耶有四種樹以不堅為堅而為眷屬以堅為不堅而為眷屬以不堅為不堅而為眷屬以堅為堅而為眷屬如此於世間有可比喻此等四種樹之人存在四者如何以不堅為堅而為眷屬以堅為不堅而為眷屬以不堅為不堅而為眷屬以堅為堅而為眷屬如何是以不堅為堅而為眷屬之人耶於此處有一類之人是無戒惡法然而彼徒眾是具戒善法如此之人是為以不堅為堅而為眷屬猶如彼樹之不堅為堅而為眷屬此人亦然如何是以堅為不堅而為眷屬之人耶此處有一類之人是具戒善法然而彼徒眾是無戒惡法如此之人是為以堅為不堅而為眷屬猶如彼樹之堅為不堅而為眷屬此人亦然如何是以不堅為不堅而為眷屬之人耶於此處有一類之人是無戒惡法彼徒眾亦無戒惡法如此之人是為以不堅為不堅而為眷屬猶如彼樹以不堅為不堅而為眷屬此人亦然如何是以堅為堅而為眷屬之人耶於此處有一類之人是具戒善法彼徒眾亦具戒善法如此是為以堅為堅而為眷屬猶如彼樹以堅為堅而為眷屬之人此人亦然二二如何是以色為量而信色之人耶於此處有一類之人若見長見廣見形見滿而終則於其處取量而生信此言以色為量而信色之人如何是以聲為量而信聲之人耶於此處有一類之人若於其他之稱讚追隨讚嘆讚辭之處則於其處取量而生信此是以聲為量而信聲之人如何是以麤為量而信麤之人耶於此處有一類之人若見衣麤鉢麤臥具之麤種種之苦行而終則於其處取量而生信此其為以麤為量而信麤之人如何是以法為量而信法之人耶於此處有一類之人若見戒見定見慧而終則於其處取量而生信此言為以法為量而信法之人二三如何是行自利而不行利他之人耶於此處有一類之人自身具足戒然而不勸他人具足戒自身具足定然而不勸他人具足定自身具足慧然而不勸他人具足慧自身具足解脫然而不勸他人具足解脫自身具足解脫智見然而不勸他人具足解脫智見如此有行自利而不行利他之人如何是行利他而不行自利之人耶於此處有一類之人自身不具足戒然而勸他人具足戒自身不具足定然而勸他人具足定自身不具足慧然而勸他人具足慧自身不具足解脫然而勸他人具足解脫自身不具足解脫智見然而勸他人具足解脫智見如此有行利他而不行自利之人如何是亦行自利亦行利他之人耶於此處有一類之人自身具足戒又勸他人具足戒自身具足定又勸他人具足定自身具足慧又勸他人具足慧自身具足解脫又勸他人具足解脫自身具足解脫智見又勸他人具足解脫智見如此有行自利亦行利他之人如何是不行自利又不行利他之人耶於此處有一類之人自身不具足戒亦不勸他人具足戒自身不具足定亦不勸他人具足定自身不具足慧亦不勸他人具足慧自身不具足解脫亦不勸他人具足解脫自身不具足解脫智見亦不勸他人具足解脫智見如此是不行自利又不行利他之人二四如何是勤於自苦而自苦之人耶於此處有一類之人以裸體而為人厭棄之行舐手而呼不來待而不止持來而不受故所作而不受招待而不應彼即是自甕口取出而不受自鍋口取出而不受隔離門閾而不受隔手杖而不受隔搗杵而不受人食之時由其一人而不受由孕婦而不受由授乳之婦人而不受由與男子嬉戲之婦人而不受得由布告而不受狗於近居之處而不受於蠅群行之處而不受魚不受肉不受穀酒木酒穀類之酸粥不受彼即是由一家而受唯一搏而生活或由二家而受唯二搏而生活乃至或由七家而受唯七搏而生活於一施亦生活於二施亦生活乃至七施亦生活一日攝一食二日攝一食乃至七日攝一食如此勤循環於半月間食而住彼亦食生菜栗粒野上之穀類皮之削屑蘚苔樹脂米糠丟棄之焦飯摺胡麻牛糞林中樹根果實以及掉落之果實而生活彼亦著麻衣屍衣雜衣糞掃衣樹皮衣鹿皮衣破裂之鹿皮衣結茅草衣連結之樹皮衣連結之木屑衣人髮褐衣尾毛褐衣鵂鶹翼衣拔鬚髮勤拔髮鬚又直立而却座又蹲踞而修蹲踞者之精勤又住於荊棘之上且臥於荊棘之牀又修於早上白天晚上之三時水浴行而住如以上多異種類之修身痛徧痛之行而住如此是為勤於自苦而自苦之人如何是勤於他苦而令他苦之人耶於此處有一類之人屠羊者屠豬者捕鳥者獵獸者殘酷之捕魚者盜賤魁膾司獄或又有其餘所有殘忍之行為者如此是為勤於他苦而令他苦之人如何是勤於自苦而自苦又勤於他苦而令他苦之人耶於此處有一類之人或為剎帝利灌頂王或為婆羅門大家彼於城東方令造新之祠壇剃除鬚髮被著鹿皮之衣以酥油塗抹肢體以鹿角揩磨其背與第一王后及宰輔婆羅門共同進入祠壇彼於其處不敷座而臥於青草所生之地有相同顏色之犢之一母牛以一乳房之乳供王生活以第二乳房之乳供第一王后生活第三乳房之乳供宰輔婆羅門生活以第四乳房之乳祀祠火天其餘之飼養犢彼即如是言為祭祀宰殺如此數量之牛王為祭祀而宰殺如此數量之犢子為祭祀而宰殺如此數量之牝牛為祭祀而宰殺如此數量之山羊為祭祀而宰殺如此數量之豬為繫上犧牲於柱而砍伐如此數量之樹木為敷設祭場而可割如此數量之茅草所有者為彼之從屬或奴僕或差役或僮僕一切皆懼怕責罰恐怖而膽怯流淚哭泣而為事如此之人是為勤於自苦而自苦勤於他苦而令他苦之人如何是不勤於自苦而不令自苦不勤於他苦而不令他苦之人耶於彼不自苦不令他苦者是已於現法而無渴愛安穩清涼領受快樂自身為梵而住此處有如來應供正自覺明行具足善逝世間解無上應調丈夫御者天人師覺者世尊生於此世彼於此之世間天魔梵天沙門婆羅門天神人民眾而自了知作證已說彼宣說法而初善中善後善有義有文開示純一圓滿清淨之梵行長者或長者之子或生於任何家之人聞其法彼聞其法已而於如來獲得信心彼獲得信心獲得成就而作此思惟謂在家迫迮而是塵穢之處出家是寬曠染著於家之人即是一向圓滿一向清淨而不容易行如珂貝所研磨之梵行我今剃除鬚髮而著壞色之衣出家而趣向非家彼於後時或捨棄少財位聚或捨棄多財位聚或捨棄少親屬或捨棄多親屬剃除髮鬚著壞色之衣由家而出趣向非家彼如是出家而為沙門具足比丘所學之同住斷絕殺生遠離殺生捨棄刀杖有恥有悲憐愍一切有情而安住斷絕不與取遠離不與取取所應與者企望所給與者不偷盜清淨自身而住斷絕非梵行而為梵行者遠行者遠離婬穢法斷絕虛誑語遠離虛誑語持續諦語與實語堅實應予信認不欺世間斷絕離間語遠離離間語由彼聞已為破它向此而不語或由此聞已為破它向彼而不語如此使已破壞者和合或令讚美和好者堅固愛和合樂和合喜和合作和合之語斷絕麤惡語遠離麤惡語所有之清美順耳可樂徹心可愛令多人愛多人樂發如是之語斷絕雜穢語遠離雜穢語應時而語語真語義語法語調伏可留於心中應時具足譬喻因緣有邊際能作引義利之語彼遠離危害種子類植物類為一食者夜不食遠離非時食遠離觀賞舞踊歌詠音樂娛樂物遠離華鬘香塗香此等之裝飾遠離高床大床遠離接受金銀遠離接受生穀遠離接受生肉遠離接受婦人與童女遠離接受婢僕遠離接受山羊羊遠離接受雞豬遠離接受象牛馬牝馬遠離接受田處遠離送達通信又作使遠離作買賣遠離偽秤偽函偽斗遠離收賄不當利得欺瞞偽造之行為遠離割截殺縛埋伏掠奪強盜之事彼唯覆身之衣唯以養腹之食而滿足出行之時經常攜帶而出行譬如有翼之鳥飛翔於何處必以翼之擔翔正實如此比丘唯以覆身之衣唯以養腹之食而滿足出行何處經常攜帶而出行彼成就此聖戒蘊而感受內心無罪之樂彼以眼見色已而不取相不取好所以彼不防護眼根而住之時則貪憂之惡不善法將流入彼為防護而修行防護眼根擁護眼根以耳聞聲已乃至以聲嗅香已乃至以舌味味已乃至以身觸觸已乃至以意識法已而不取相不取好所以不防護彼意根而住時則貪憂之惡不善法將流入彼為防護而修行防護意根擁護意根彼成就此聖根律儀而感受內心無罪之樂彼以正知作往來以正知觀前視左右以正知作屈伸以正知持僧伽梨衣鉢以正知食飲嚼味以正知大小便以正知行以正知住坐臥眠寢語默彼成就此聖戒蘊又成就此聖根律儀又成就此聖正念正知又成就此聖知足而得空閑樹下山窟洞塚間林藪曠野稈堆之遠離處彼食訖由行乞而還結跏趺坐以正身端直對面念住彼斷絕世間之貪欲遠離心貪而住由心貪而遠離斷絕瞋恚無瞋心而住利益哀愍一切之有命苦由心瞋恚而遠離斷絕惛眠遠離惛眠而住有光明想正念正智而遠離心惛眠斷絕掉悔無掉舉而住於內心寂靜由心掉舉而遠離斷絕疑慮已渡疑而住於善法不猶豫由心疑而遠離彼斷絕此等之五蓋遠離諸欲不善之法以有尋有伺具足離生喜樂之第一靜慮而住更以尋伺寂靜內等淨心定一趣之故無尋無伺具足定生喜樂之第二靜慮而住由喜離貪之故於捨而住念正智以身正受樂具足聖者宣說之捨念樂住之第三靜慮而住更由於斷樂斷苦之故及先已斷喜憂不苦不樂之故具足捨念清淨之第四靜慮而住彼如是心定清淨清白無穢遠離隨煩惱柔軟堪能而住得無動之時心趣向宿住隨念智彼隨念無數若干之宿住即隨念一生二生三生四生五生十生二十生三十生四十生五十生百生千生百千生無數成劫生無數壞劫生無數成壞劫謂於彼處感受如是之名種姓姓生食苦樂為如是之長壽彼由其處死去而生於他處於其處感受如是之名種姓姓生食苦樂有如是之長壽彼由其處死去而於此處具有如此之形相方處而隨念無數若干宿世之住處彼如是心定清淨清白無穢遠離隨煩惱柔軟堪能而住得無動之時心趣向於有情死生智彼以超人清淨之天眼觀有情而有死有生劣勝妙色惡色知有情如業之至善趣惡趣諸賢實此等之有情成就身惡行語惡行意惡行誹謗聖者以邪見受邪見業彼等身壞死後生於無幸處惡趣險難地獄諸賢實此等之有情成就身妙行語妙行意妙行不誹謗聖人以正見受正見業彼等身壞死後生於善趣天界如是彼以超人界清淨之天眼觀有情而有死有生劣勝妙色惡色知有情如業之至善趣惡趣彼如是心定清淨清白無穢遠離隨煩惱柔軟堪能而住得無動之時心趣向於漏盡智彼如實證知此是苦乃至如實證知此是苦滅之道如實證知此等漏如實證知此是漏集乃至如實證知此是至導漏滅之道如是知如是見故由欲漏心解脫由有漏心解脫由無明漏心解脫於解脫而解脫之智慧生生已盡梵行已修所作已作證知不再來此生如此之人不自苦不勤於自苦不他苦不勤於他苦之人彼不自苦不他苦者已於現法無渴愛安穩清涼領受樂自為梵而住二五如何是有貪人耶是其人之貪而不捨離此言為有貪人如何是有瞋人耶是其人之瞋而不捨離此言為有瞋人如何是有癡人耶是其人之癡而不捨離此言為有癡人如何是有慢人耶是其人之慢而不捨離此言為有慢人二六如何是得內心之止不得依增上慧法觀之人耶於此處有一類之人若色俱行或得無色俱行之等至或不得出世間道果如此之人言為得內心之止不得依增上慧法觀之人如何是得依增上慧法之觀不得內心止之人耶於此處有一類之人或有得出世間道果或色俱行或不得無色俱行之等至如此之人是為得依增上慧法之觀不得內心止之人如何是得內心之止又得依增上慧法觀之人耶於此處有一類之人或色俱行或得無色俱行之等至又或有得出世間道果如此之人是為得內心之止又得依增上慧法觀之人如何是不得內心之止又不得依增上慧法觀之人耶於此處有一類之人或色俱行或不得無色俱行之等至又或不得出世間道果如此之人是為不得內心之止又不得依增上慧法觀之人二七如何是順流行人耶於此處有一類之人以染習諸欲又造惡業此是順流行人如何是逆流行人耶於此處有一類之人以不染習諸欲又不造惡業彼雖有苦有憂淚流泣於面但修圓滿清淨之梵行此言為逆流行人如何是自住人耶於此處有一類之人以盡五順下分結而為化生者於彼處般涅槃由其世界而不退還此言為自住人如何是已渡到彼岸而住果之婆羅門人耶於此處有一類之人由漏以無漏之心解脫慧解脫已於現法自了知作證具足而住此言為已渡到彼岸而住果之婆羅門人二八如何是以少聞而聞不達成之人耶於此處有一類之人少聞契經應頌記說諷頌無問自說如是說本生未曾有法吠陀羅彼不知其少聞之義不知法不行法隨法如此之人是為少聞而聞不達成之人如何是以少聞而聞達成之人耶於此處有一類之人少聞契經乃至吠陀羅彼知其少聞之義知法行法隨法如此之人是為少聞而聞達成之人如何是多聞而聞不達成之人耶於此處有一類之人多聞契經乃至吠陀羅彼不知其多聞之義亦不知法不行法隨法如此之人是為多聞而聞不達成之人如何是以多聞而聞達成之人耶於此處有一類之人多聞契經乃至吠陀羅彼知其多聞之義知法行法隨法如此之人是為多聞而聞達成之人二九如何是不動沙門之人耶於此處有一類之人徧盡三結而入預流不退墮法決定趣正覺此言為不動沙門人如何是紅蓮華沙門之人耶於此處有一類之人徧盡三結淡薄貪瞋癡而為一來唯一次來此世間而作苦之邊際此言為紅蓮華沙門之人如何是白蓮華沙門之人耶於此處有一類之人徧盡五順下分結而為化生者於此處般涅槃而由其世界為不退還法此言為白蓮華沙門之人如何是沙門中之柔軟沙門之人耶於此處有一類之人由漏盡以無漏之心解脫慧解脫於現法了知作證具足而住此言為沙門中之柔軟沙門之人第四章畢第五章五人一此處所謂有人作違犯之行又後悔又不如實知彼之心解脫慧解脫此中彼之此等已生之惡不善法無餘滅彼因此應如此述實由具壽之行生諸漏是存在由生後悔而諸漏增加善哉實具壽是斷絕由行所生之諸漏排除由後悔所生之諸漏而修心與慧如此具壽可完全相等彼之第五人此處所謂有人作違犯之行而不後悔又不如實知彼之心解脫慧解脫此中彼之此等已生之惡不善法無餘滅彼因此應如此述實由具壽之行所生之諸漏是存在由後悔所生之諸漏不增加善哉實具壽斷滅由行所生之諸漏而修心與慧如此具壽可完全相等彼之第五之人此處所謂有人不作違犯之行而後悔又不如實知彼之心解脫慧解脫此中彼之此等已生之惡不善法無餘滅彼因此應如此述實由具壽之行所生之諸漏是不存在由後悔所生之諸漏乃增加善哉實具壽排除由後悔所生之諸漏而修心與慧如此具壽可完全相等此之第五人此處所謂有人不作違犯之行而不後悔又不如實知彼之心解脫慧解脫此中彼之此等已生之惡不善法無餘滅彼因此應如此述實由具壽之行所生之諸漏是不存在由後悔所生之諸漏乃不增加善哉實具壽可修心與慧如此具壽可完全相等彼之第五人該等之四人是依此第五之人如此所教授如此所教誡而如次達漏之盡二如何是施已而輕蔑之人耶於此處有一類之人施衣食牀座病緣藥資具彼謂我施此而彼受之前者施於後者已而輕蔑如此是為施已而輕蔑之人如何是共住而輕蔑之人耶於此處有一類之人與人俱或二年或三年共住共住前者而輕蔑後者如此是為共住而輕蔑之人如何是輕信之人耶於此處有一類之人他者或語稱讚不稱讚之時隨信彼如此是為輕信之人如何是不確信之人耶於此處有一類之人少信少仰少愛少歡如此是為不確信之人如何是以鈍為癡之人耶於此處有一類之人不知善不善之法不知有罪無罪之法不知劣勝之法不知黑白相對之法如此是為以鈍為癡之人三如何是五戰士喻人耶有五戰士此處有一類之戰士唯見塵埃聚恐懼而發抖足踏不已不能戰鬥此處亦有如此一類之戰士此戰士而存在於世之第一復次此處有一類之戰士忍受塵埃聚見幢群恐懼而發抖足踏不已不能戰鬥此處亦有如此一類之戰士此戰士而存在於世之第二復次此處有一類之戰士忍受塵埃群亦忍受幢群聞其喊聲恐懼發抖足踏不已不能戰鬥此處亦有如此一類之戰士此戰士而存在於世之第三復次此處有一類之戰士忍受塵埃聚忍受幢群亦忍受其喊聲方纔相擊而負失神此處亦有如此一類之戰士此有戰士而存在於世之第四復次此處有一類之戰士忍受塵埃聚忍受幢群忍受喊聲忍受相擊彼勝戰鬥而為勝者即住其本營此處亦有如此一類之戰士此戰士而存在於世之第五此有可喻於此等戰士之五人存在於比丘眾中如何為五於此有一類比丘唯見塵埃而恐怖戰慄蹈足不止不能繼續梵行表示弱學棄學而退轉其塵埃聚者如何於此處有比丘聞某村或邑或女人童女美麗而見勝為殊見者歡喜成就最上之色形彼聞已而恐懼戰慄足踏不已不能繼續梵行表示弱學棄學而退轉此為彼之塵埃聚譬如彼戰士唯見塵埃聚而恐懼戰慄踐踏不已不能戰鬥此人亦然此處亦有如此一類之人即是可喻於第一戰士之人而存在於比丘眾中復次此處有一類之比丘忍受塵埃聚唯見幢群而恐懼戰慄踐踏不已不能繼續梵行表示弱學而退轉彼幢群者如何於此處有比丘不只聞某村邑或女人童女美麗而見勝為殊見者歡喜成就最上之色形彼由見或女人童女之美麗而見勝為殊見者歡喜成就最上之色形彼見彼女已而恐懼戰慄足踏不已不能繼續梵行表示弱學棄學而退轉此為彼幢群譬如彼之戰士忍受塵埃聚見幢群則恐懼而戰慄踐踏不已不能戰鬥此人亦然此處亦有一類之人是可喻於第二戰士之人而存在於比丘眾中復次此處有一類之比丘忍受塵埃聚亦忍受幢群聞其喊聲而恐懼戰慄足踏不已不能繼續梵行表示弱學棄學而退轉彼之喊聲者如何此處有女人或近居住於林中樹下空屋之比丘已發嘲笑談話拍手哄笑輕弄之語彼女人所嘲笑談話拍手哄笑則恐懼而戰慄足踏不已不能繼續梵行表示弱學棄學而退轉此是彼喊聲譬如有戰士忍受塵埃聚亦忍受幢群聞其喊聲而恐懼戰慄足踏不已不能戰鬥此人亦然此處有如此一類之人是可喻於第三戰士之人而存在於比丘眾中復次此處有一類之比丘忍受塵埃聚忍受幢群亦忍受彼喊聲纔相擊而負失神其相擊者如何即此處有女人或近居住於林中樹下空屋之比丘已而侵坐侵臥覆蔽彼女人即侵坐侵臥覆蔽而不棄學不示羸弱而行淫此為其相擊譬如有彼之戰士忍受塵埃聚忍受幢群亦忍受彼之喊聲於相擊而負失神此人亦然此處有一類之人是可喻於第四戰士之人而存在於比丘眾中復次此處有一類之比丘忍受塵埃聚忍受幢群忍受彼喊聲亦忍受其相擊彼克勝其戰鬥而為勝者即住於其本營戰鬥之克勝者如何此處有女人或近居住於林中樹下空屋之比丘而侵坐侵臥覆蔽彼女人侵坐侵臥覆蔽而解逃去隨意之處彼即用叢林樹下山窟山龕塚間高原迴處稻稈積所離之坐臥處彼或住於林中樹下空屋而結跏趺坐願端身對面念安立彼斷絕世中之貪心無貪而住淨治心之貪斷絕瞋失心無瞋而住饒益悲愍一切有情淨治心之瞋失斷絕惛眠無惛眠而住有光明想以正念正知而淨治惛眠之心斷絕掉悔無掉舉而住以內心寂靜而淨治心之掉悔斷除疑慮而住於善法而無疑慮淨治心之疑彼染污人以慧弱斷絕此等之五蓋離欲不善法以有尋有伺而具足離生喜樂之第一靜慮而住具足尋伺寂靜之第二靜慮第三靜慮第四靜慮而住彼如是心得定而淨潔白無垢遠離染污柔軟得堪能不動而住時為滅盡諸漏而引發心彼如實知此是苦乃至如實知此是導至苦滅之道如實了知此是漏乃至如實知此是導至漏滅之道彼如是知如是見故解脫心欲漏解脫心有漏解脫心無明漏於已解脫者有已解脫之智生已盡梵行已住應辨已辨更不還於現狀此是戰鬥之克勝譬如有戰士忍受塵埃聚忍受幢群忍受彼喊聲忍受彼相擊彼勝此戰鬥而為戰鬥之勝者即住於彼之本營此人亦然此處亦有如此一類之人即可喻於第五戰士之人而存在於比丘眾中四如何是五之乞食者耶是鈍癡之故有乞食者惡欲惡性之故有乞食者憍慢之故有乞食者諸佛諸佛聲聞所讚之故有乞食者唯依少欲喜足儉約彼唯依正為乞食者此中所謂彼之乞食者唯依少欲喜足儉約彼唯依正為乞食者此是此等五之乞食者中之第一為最上勝譬如由牛之乳由乳之酪由酪之生酥由生酥之熟酥由熟酥之醍醐者為此中之第一正是如此所謂彼唯依少欲喜足儉約彼唯依正為乞食者此為此等五乞食者中之第一最首上勝此等為五之乞食者五一四如何是五之不後食者耶五之一食者耶五之糞掃衣者耶五之但三衣者耶五之住林者耶五之樹下住者耶五之迴處坐者耶五之常坐者耶五之隨得座者耶五之塚間坐者耶此中如何是五之塚間坐者耶是鈍癡之故有塚間坐者惡欲惡性之故有塚間坐者憍亂心之故有塚間坐者諸佛諸佛聲聞所讚之故有塚間坐者唯依少欲喜足儉約彼依正為塚間坐者此中所謂彼之塚間坐者唯依少欲喜足儉約唯彼依正為塚間坐者此為此等五塚間坐者中之第一最首上勝譬如由牛之乳由乳之酥由酪之生酥由生酥之熟酥由熟酥之醍醐者為此中之第一正是如此所謂彼唯依少欲喜足儉約彼依正為塚間坐者此為此等五塚間坐者中之第一最首上勝此等為五塚間坐者第五章畢第六章六人一此中如何是先不隨聞諸法自身現等覺諸諦又於其處獲得一切智又於諸果為自在之人耶是正自覺者乃依此可見此中如何是先不隨聞諸法自身現等覺諸諦又於其處不獲得一切智又於諸果不為自在之人耶是獨覺者乃依此可見此中如何是先不隨聞諸法自身現等覺諸諦於現法為苦之邊際成為聲聞最上之人耶是舍利弗目連乃依此可見此中如何是先不隨聞諸法自身現等覺諸諦於現法為苦之邊際不為聲聞最上之人耶是諸餘之阿羅漢乃依此可見此中如何是先不隨聞諸法自身現等覺諸諦於現法為苦之邊際為不還不來於現狀之人耶是不還者乃依此可見此中如何是先不隨聞諸法自身現等覺諸諦於現法不為苦之邊際為一來還於現狀之人耶是預流一來者乃依此可見第六章畢第七章七人一如何是一度沈而沈下之人耶於此處有一類之人具足一向黑之不善法如此之人是為一度沈而沈下如何是浮出已而再沈下之人耶於此處有一類之人善哉於信善法而浮出善哉於慚善法而浮出善哉於愧善法而浮出善哉於精進善法而浮出善哉於慧善法而浮出於彼其信不住立不增唯減於彼其慚不住立不增唯減於彼其愧不住立不增唯減於彼其精進不住立不增唯減於彼其慧不住立不增唯減如此之人是為浮出已而再沈下如何是浮出已而住立之人耶於此處有一類之人善哉於信善法乃至於慧善法而不浮出於彼其信不減不增而住於彼其慚不減不增而住於彼其愧不減不增而住於彼其精進不減不增而住於彼其慧不減不增而住如此之人是為浮出已而住立如何是浮出已而觀察省察之人耶於此處有一類之人善哉於信乃至於慧善法而浮出彼乃滅盡三結而為預流者不退墮者決定者趣向菩提者如此之人是為浮出已而觀察省察之人如何是浮出已而前進之人耶於此處有一類之人善哉於信乃至於慧善法而浮出彼乃滅盡三結使貪瞋癡淡薄而為一來者一度來此世為苦之邊際如此之人是為浮出已而前進如何是浮出已而得立足處之人耶於此處有一類之人善哉於信乃至於慧善法而浮出彼乃滅盡五順下分結而為化生者於彼處般涅槃由其世為不退轉之人如此之人是為浮出已而得立足處之人如何之人是浮出已而度達彼岸住立果之婆羅門耶於此處有一類之人善哉於信乃至於慧善法而浮出彼乃滅盡諸漏無漏之心解脫慧解脫於現法自了知作證具足已而住如此之人為浮出已而度達彼岸住立果之婆羅門二如何是俱分解脫人耶於此處有一類之人身證八解脫且又依其慧而見彼四諦已滅盡諸漏而住此為俱分解脫人如何是慧解脫身證見至信解脫隨法行人耶如何是隨信行人耶乃預流果能作證向人之信根為殊勝而運作其信先以立信先而修聖道此言為隨信行人預流果能作證向人之隨信行若住於果者是為信解脫第七章畢第八章八人一此中如何是四道具足四果具足之人耶是預流與預流果能作證向一來與一來果能作證向不還與不還果能作證向阿羅漢與阿羅漢果能作證向此等言為四道具足四果具足之人第八章畢第九章九人一如何是正自覺之人耶於此處有一類之人先於不隨聞諸法自現等覺諸諦於其處獲得一切智又於諸果自在此言為正自覺之人如何是獨覺之人耶於此處有一類之人先不隨聞諸法自現等覺諸諦於其處不獲得一切智又諸果不自在此言為獨覺之人如何是俱分解脫人耶於此處有一類之人身證八解脫而住又依其慧而見彼四諦已滅盡諸漏而住此言為俱分解脫人如何是慧解脫人耶於此處有一類之人身不能證八解脫而住又依其慧而見彼四諦已滅盡諸漏而住此言為慧解脫人如何是身證人耶於此處有一類之人身證八解脫而住又依其慧而見彼四諦已滅盡一類之漏而住此言為身證人如何是見至人耶於此處有一類之人如實知此是苦乃至如實知此是導至苦滅之道依慧而善見善行依如來所悟之法依慧而見彼四諦已滅盡一類之漏而住此言為見至人如何是信解人耶於此處有一類之人如實知此是苦乃至一三四參照滅盡而住然而不如見至人之時此言為信解人如何是隨法行人耶是預流果能作證向人之乃至一三五參照預流果能作證向人以隨法行人若入於果者為見至人如何是隨信行人耶於預流果能作證向人之乃至一三六參照預流果能作證向人以隨信行人入於果者為信解人第九章畢第十章十人一如何人以五之此世而終之人耶是極七返家家一生一來及所有之現法阿羅漢此為以五之此世而終之人如何之人以捨五之此世已而終之人耶是中般涅槃生般涅槃無行般涅槃有行般涅槃上流阿迦膩吒天之者此為捨五之此世已而終之人此處所謂諸人之人施設也第十章畢人施設畢
